<script>
    const RAPIDAPI_KEY = '9fb79c3f4fmsh7a24986a3e29096p14bcbcjsn4d750149edf4';

    function openSmartLink(event) {
        event.preventDefault();
        const smartUrl = "https://www.effectivecpmnetwork.com/gi4qdbfkv?key=7987134f027323f0be6f6617a127dec2";
        
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            window.Telegram.WebApp.openLink(smartUrl);
        } else {
            window.open(smartUrl, '_blank');
        }
    }

    function triggerInterstitialAndDownload() {
        srv();
    }

    async function forceDl(url, name) {
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (err) {
            window.open(url, '_blank');
        }
    }

    async function srv() {
        const u = document.getElementById('vUrl').value.trim();
        const l = document.getElementById('ldr');
        const r = document.getElementById('result');
        const btnV = document.getElementById('btnV');
        const btnM = document.getElementById('btnM');

        if(!u) return;

        l.style.display = 'block';
        r.style.display = 'none';

        try {
            const response = await fetch('https://social-download-all-in-one.p.rapidapi.com/v1/social/autolink', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-rapidapi-host': 'social-download-all-in-one.p.rapidapi.com',
                    'x-rapidapi-key': RAPIDAPI_KEY
                },
                body: JSON.stringify({ url: u })
            });

            const data = await response.json();
            console.log("API Response:", data);
            l.style.display = 'none';

            const mediaList = data.medias || data.data || (data.url ? [data] : null);

            if (mediaList && mediaList.length > 0) {
                r.style.display = 'block';

                const videoObj = mediaList.find(m => m.type === 'video' || m.extension === 'mp4') || mediaList[0];
                const audioObj = mediaList.find(m => m.type === 'audio' || m.extension === 'mp3');

                const videoUrl = videoObj.url || data.url;
                if (videoUrl) {
                    btnV.style.display = 'block';
                    btnV.onclick = () => forceDl(videoUrl, "video.mp4");
                }

                if (audioObj && audioObj.url) {
                    btnM.style.display = 'block';
                    btnM.onclick = () => forceDl(audioObj.url, "audio.mp3");
                } else {
                    btnM.style.display = 'none';
                }
            } else {
                alert("Error: " + (data.message || "Invalid link or no media found."));
            }
        } catch (e) {
            console.error(e);
            alert("Server error.");
            l.style.display = 'none';
        }
    }
</script>
