<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Stream Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d11;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #16161e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #232332;
    }

    .player-header {
      padding: 15px 20px;
      background: #1a1a24;
      border-bottom: 1px solid #232332;
    }

    .player-header h2 {
      font-size: 18px;
      color: #7aa2f7;
      font-weight: 600;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Aspect Ratio 16:9 */
      background: #000;
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-footer {
      padding: 15px 20px;
      font-size: 13px;
      color: #787c99;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-header">
      <h2>Anime Episode Player</h2>
    </div>
    
    <div class="iframe-wrapper">
      <iframe 
        src="https://hgcloud.to/e/pr6xxjyc7qh5" 
        allowfullscreen="true" 
        webkitallowfullscreen="true" 
        mozallowfullscreen="true"
        scrolling="no">
      </iframe>
    </div>

    <div class="player-footer">
      <span>Server: HGCloud</span>
      <span>HD Quality</span>
    </div>
  </div>

</body>
</html>
